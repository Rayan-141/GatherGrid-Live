                            </div>
                            <div class="col-50 payment">

                                </div>
                                <div class="radio-input">
                                  <input id="paypal" type="radio" checked>

                          <div class="payment-row">

                              <label for="cname">Cardholder's Name</label>
                              <input type="text" id="cname" name="cardname" placeholder="Firstname Lastname" required />
                            </div>
                            <div class="col-50">
                              <label for="ccnum">Credit card number</label>

                            </div>
                            <div class="col-50">

                                </div>

                <!-- Details -->

                      <td style="padding:8px 0;font-size:12px;color:#888;text-transform:uppercase;font-weight:600;">

                      <td
                        style="padding:8px 0;font-size:12px;color:#888;text-transform:uppercase;font-weight:600;border-top:1px solid #f0f0f0;">
                        Time</td>
                      <td
                        style="padding:8px 0;font-size:14px;color:#222;text-align:right;font-weight:500;border-top:1px solid #f0f0f0;"
                        id="eticket-time">—</td>
                    </tr>
                    <tr>
                      <td
                        style="padding:8px 0;font-size:12px;color:#888;text-transform:uppercase;font-weight:600;border-top:1px solid #f0f0f0;">
                        Seats</td>

                        style="padding:8px 0;font-size:14px;color:#222;text-align:right;font-weight:500;border-top:1px solid #f0f0f0;"

                    </tr>
                    <tr>
                      <td
                        style="padding:8px 0;font-size:12px;color:#888;text-transform:uppercase;font-weight:600;border-top:1px solid #f0f0f0;">
                        Attendees</td>
                      <td
                        style="padding:8px 0;font-size:14px;color:#222;text-align:right;font-weight:500;border-top:1px solid #f0f0f0;"
                        id="eticket-attendees">—</td>
                    </tr>
                    <tr>
                      <td
                        style="padding:8px 0;font-size:12px;color:#888;text-transform:uppercase;font-weight:600;border-top:1px solid #f0f0f0;">
                        Price/Ticket</td>

              </div>
        </div>

        <input type="button" name="previous-step" class="home-page-btn" value="Browse to Home Page"

  <!-- Reliable QR Code Library (EasyQRCodeJS) -->
  <script src="https://cdn.jsdelivr.net/gh/ushelp/EasyQRCodeJS@master/dist/easy.qrcode.min.js"></script>
  <script src="js/api_integration.js"></script>
  <script>
    // Generate E-Ticket with QR Code when reaching the E-Ticket step
    async function generateETicket() {
      const eventName = localStorage.getItem('selectedEvent') || 'Event';
      const eventDate = localStorage.getItem('selectedDate') || 'TBA';
      const eventTime = localStorage.getItem('selectedTime') || 'TBA';
      let rawPrice = localStorage.getItem('selectedPrice') || '500';
      const seatCount = localStorage.getItem('selectedSeatsCount') || '0';
      const venue = localStorage.getItem('selectedVenue') || 'TBA';
      const selectedSeatsArray = JSON.parse(localStorage.getItem('selectedSeats') || '[]');
      const seatsStr = selectedSeatsArray.length > 0 ? selectedSeatsArray.join(', ') : 'N/A';

      // CLEANUP PRICE: Remove ₹ and "onwards" to avoid NaN
      const eventPrice = parseInt(String(rawPrice).replace(/[^0-9]/g, '')) || 500;
      const totalPriceInfo = eventPrice * parseInt(seatCount);
      let bookingId = 'GG-' + Date.now();

      // Collect user details from forms (using the ones we just fetched or re-fetching safely)
      const users = [];
      const userCards = document.querySelectorAll('.user-form-card');

      const firstCardInputs = userCards.length > 0 ? userCards[0].querySelectorAll('input') : [];
      const userData = {
        name: firstCardInputs[0]?.value || 'Anonymous',
        email: firstCardInputs[1]?.value || 'user@example.com',
        phone: firstCardInputs[2]?.value || '0000000000'
      };

      // Map event and seat IDs for REAL GraphDB sync
      const eventId = parseInt(localStorage.getItem('selectedEventId')) || 1;
      const seatNumbers = JSON.parse(localStorage.getItem('selectedSeatNumbers') || '[]');

      // Metadata for JIT creation
      const eventMetadata = {
        title: eventName,
        venue: venue,
        date: eventDate + " " + eventTime,
        price: eventPrice,
        image: localStorage.getItem('selectedImage') || 'event_images/Karan Aujla.png'
      };

      try {
        // 1. Create Booking in Neo4j with JIT Event/Seat creation
        const booking = await apiCreateBooking(userData, eventId, seatNumbers, eventMetadata);
        console.log("Booking created in GraphDB (JIT):", booking);
        bookingId = `GG-DB-${booking.id}`;
        console.log("Booking created in GraphDB:", booking);
        bookingId = `GG-DB-${booking.id}`;

        // 2. Confirm Payment in Neo4j
        await apiConfirmPayment(booking.id, totalPriceInfo);
        console.log("Payment confirmed in GraphDB");

      } catch (err) {
        console.error("GraphDB Sync Failed:", err);
      }

      // ── REST OF THE UI LOGIC ──

      userCards.forEach(card => {
        const inputs = card.querySelectorAll('input, select');
        if (inputs.length > 0) {
          users.push({
            name: inputs[0]?.value || 'N/A',
            phone: inputs[2]?.value || 'N/A'
          });
        }
      });

      // Populate e-ticket display
      document.getElementById('eticket-event-name').textContent = eventName;
      document.getElementById('eticket-date').textContent = eventDate;
      document.getElementById('eticket-time').textContent = eventTime;
      document.getElementById('eticket-seats').textContent = seatsStr;
      document.getElementById('eticket-attendees').textContent = users.length || seatCount;
      document.getElementById('eticket-price').textContent = '₹' + eventPrice;
      document.getElementById('eticket-total').textContent = '₹' + totalPriceInfo;
      document.getElementById('eticket-booking-id').textContent = 'Booking ID: ' + bookingId;

      // Build QR code content: Comprehensive Detail Summary (Full Offline)
      let qrText = `🎟️ GATHERGRID OFFICIAL TICKET 🎟️\n`;
      qrText += `---------------------------\n`;
      qrText += `📅 Event: ${eventName}\n`;
      qrText += `📍 Location: ${venue}\n`;
      qrText += `📆 Date: ${eventDate}\n`;
      qrText += `⏰ Time: ${eventTime}\n`;
      qrText += `💺 Seats: ${seatsStr}\n`;
      qrText += `🎫 Tickets: ${seatCount}\n`;
      qrText += `💰 Total: ₹${totalPriceInfo}\n`;
      qrText += `🆔 ID: ${bookingId}\n`;
      qrText += `---------------------------\n`;
      qrText += `👤 Attendees:\n`;
      users.forEach((u, index) => {
        qrText += `${index + 1}. ${u.name} (${u.phone})\n`;
      });
      qrText += `---------------------------\n`;
      qrText += `Verify at Entry\n`;

      // 10000% GUARANTEED QR GENERATION (Using Reliable API)
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      const encodedText = encodeURIComponent(qrText);
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodedText}`;

      const img = new Image();
      img.src = qrUrl;
      img.alt = "Scan QR";
      img.style.width = "180px";
      img.style.height = "180px";
      img.style.display = "block";
      img.style.margin = "0 auto";

      // Add a loader state just in case
      qrContainer.innerHTML = '<p style="font-size:10px;color:#aaa;">Generating...</p>';

      img.onload = function () {
        qrContainer.innerHTML = '';
        qrContainer.appendChild(img);
      };

      img.onerror = function () {
        // Very rare fallback if API is down
        qrContainer.innerHTML = '<p style="color:red;font-size:12px;">Scan failed. ID: ' + bookingId + '</p>';
      };
    }
  </script>
  <script>

    function generateUserForms() {
      const seatCount = parseInt(localStorage.getItem('selectedSeatsCount')) || 0;
      const container = document.getElementById('dynamic-user-forms');
      container.innerHTML = '';

      if (seatCount === 0) {
        container.innerHTML = '<p style="color: var(--theme-rose);">Please select at least one seat.</p>';
        return;
      }

      for (let i = 1; i <= seatCount; i++) {
        const card = document.createElement('div');
        card.className = 'user-form-card';
        card.innerHTML = `
        <h4>User ${i} Details</h4>
        <div class="user-grid">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter name" required>
          </div>
          <div class="form-group">
            <label>Email ID</label>
            <input type="email" placeholder="Enter email" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone" required>
          </div>
          <div class="form-group">
            <label>Age</label>
            <input type="number" placeholder="Enter age" required>
          </div>
          <div class="form-group">
            <label>Birth Date</label>
            <input type="date" required>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select style="width: 100%; padding: 8px; border-radius: 5px; background: var(--theme-bg); color: var(--theme-title); border: 1px solid var(--theme-border);">
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>
      `;
        container.appendChild(card);
      }
    }
  </script>
